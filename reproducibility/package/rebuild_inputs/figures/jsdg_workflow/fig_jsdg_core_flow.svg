<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#34495e"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#34495e; stroke-width:2.4; rx:12; }
      .normal { fill:#eaf4fb; stroke:#1675b6; }
      .robust { fill:#fff0e8; stroke:#d9531e; }
      .js { fill:#f5ecfa; stroke:#7d3294; }
      .merge { fill:#eef2f4; stroke:#34495e; }
      .label { font-family:Helvetica,Arial,sans-serif; font-size:21px; font-weight:600; fill:#263746; text-anchor:middle; }
      .small { font-family:Helvetica,Arial,sans-serif; font-size:17px; fill:#425466; text-anchor:middle; }
      .arrow { fill:none; stroke:#34495e; stroke-width:2.5; marker-end:url(#arrow); }
      .title { font-family:Helvetica,Arial,sans-serif; font-size:24px; font-weight:700; fill:#17324d; text-anchor:middle; }
    </style>
  </defs>

  <text x="450" y="35" class="title">JS-DG core information flow</text>

  <rect x="35" y="80" width="180" height="70" class="box normal"/>
  <text x="125" y="110" class="label">Projected text</text>
  <text x="125" y="135" class="small">representation</text>

  <rect x="35" y="350" width="180" height="70" class="box normal"/>
  <text x="125" y="380" class="label">Projected video</text>
  <text x="125" y="405" class="small">representation</text>

  <rect x="275" y="62" width="190" height="80" class="box normal"/>
  <text x="370" y="95" class="label">Normal DGF path</text>
  <text x="370" y="121" class="small">inherited fusion</text>

  <rect x="270" y="205" width="200" height="90" class="box js"/>
  <text x="370" y="238" class="label">Auxiliary heads</text>
  <text x="370" y="265" class="small">Jensen-Shannon disagreement</text>

  <rect x="275" y="358" width="190" height="80" class="box robust"/>
  <text x="370" y="391" class="label">Robust branch</text>
  <text x="370" y="417" class="small">projected interactions</text>

  <rect x="540" y="200" width="150" height="100" class="box js"/>
  <text x="615" y="240" class="label">Scalar gate</text>
  <text x="615" y="268" class="small">learned merge weight</text>

  <rect x="750" y="200" width="120" height="100" class="box merge"/>
  <text x="810" y="240" class="label">Final fused</text>
  <text x="810" y="268" class="small">representation</text>

  <path d="M215 105 L275 102" class="arrow"/>
  <path d="M215 385 C245 385 245 130 275 120" class="arrow"/>
  <path d="M215 120 C245 120 245 220 270 232" class="arrow"/>
  <path d="M215 380 C245 380 245 280 270 268" class="arrow"/>
  <path d="M215 120 C245 120 245 365 275 380" class="arrow"/>
  <path d="M215 380 L275 400" class="arrow"/>
  <path d="M470 250 L540 250" class="arrow"/>
  <path d="M465 102 C555 102 555 190 590 200" class="arrow"/>
  <path d="M465 398 C555 398 555 310 640 300" class="arrow"/>
  <path d="M690 250 L750 250" class="arrow"/>

  <text x="450" y="475" class="small">The diagram defines computation only; diagnostic associations do not establish benefit or causality.</text>
</svg>
